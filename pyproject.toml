[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcode"
version = "1.0.0"
description = "DeepCode Agent - Advanced Local AI Coding Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name="DeepCode", email="hello@example.com" }
]
dependencies = [
    "click>=8.0",
    "typer>=0.9.0",
    "textual>=0.47.0",
    "rich>=13.0.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "sqlalchemy[asyncio]>=2.0",
    "pgvector>=0.2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.28",
    "psycopg2-binary>=2.9.0",
    "pathspec>=0.12.0",
    "httpx>=0.27.0",
    "greenlet>=3.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "GitPython>=3.1.40",
    "python-dotenv>=1.0.0",
    "setuptools>=61.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0"
]

[project.scripts]
deepcode = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
